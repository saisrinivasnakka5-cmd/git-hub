<header><h1>🎬 Telugu Cinema Quiz</h1><div class="headerBtns"><button class="btn white" onclick="goHome()">Home</button><button class="btn white" onclick="toggleEditor()">⚙ Score Editor</button></div></header>

let teams=JSON.parse(localStorage.getItem('quizTeams6')||'[{"name":"Peddi","score":0},{"name":"Magadheera","score":0},{"name":"RRR","score":0},{"name":"Rangastalam","score":0}]');
let currentRound=0,currentQuestion=0,timeLeft=30,timerId=null,answered=false,stopped=false;
let usedQuestions=JSON.parse(localStorage.getItem('quizUsedQuestions6')||'{}');
const $=id=>document.getElementById(id);
function hideAll(){ $('home').style.display='none';$('numbers').style.display='none';$('questionScreen').style.display='none'; }
function renderHome(){
 $('teams').innerHTML=teams.map(t=>`<div class="team"><b>${t.name}</b><div style="margin-top:8px;font-size:18px;color:#172033">Score: <strong>${t.score}</strong></div></div>`).join('');
 $('rounds').innerHTML=data.map((r,i)=>`<button class="roundBtn" style="background:${r.color}" onclick="showNumbers(${i})"><h2>${i+1}. ${r.name}</h2><p>Click round name →</p></button>`).join('');
 renderEditor();
}  
function goHome(){clearInterval(timerId);hideAll();$('home').style.display='block';renderHome();scrollTo(0,0)}
function showNumbers(roundIndex=currentRound){clearInterval(timerId);currentRound=roundIndex;hideAll();$('numbers').style.display='block';$('numberRoundTitle').textContent=`${currentRound+1}. ${data[currentRound].name}`;$('numberGrid').innerHTML=data[currentRound].qs.map((_,i)=>{const used=(usedQuestions[currentRound]||[]).includes(i);return `<button class="numberBtn ${used?'used':''}" onclick="showQuestion(${i})">${i+1}</button>`}).join('');scrollTo(0,0)}
function showQuestion(qIndex){
 currentQuestion=qIndex;
 if(!usedQuestions[currentRound]) usedQuestions[currentRound]=[];
 if(!usedQuestions[currentRound].includes(qIndex)) usedQuestions[currentRound].push(qIndex);
 localStorage.setItem('quizUsedQuestions6',JSON.stringify(usedQuestions));
 hideAll();$('questionScreen').style.display='block';loadQuestion();scrollTo(0,0)
}
function loadQuestion(){clearInterval(timerId);const q=data[currentRound].qs[currentQuestion];timeLeft=30;answered=false;stopped=false;$('questionRoundTitle').textContent=`${currentRound+1}. ${data[currentRound].name}`;$('questionBadge').textContent=`Question ${currentQuestion+1} of 10`;$('questionText').textContent=q.q;$('options').innerHTML=q.o.map((o,i)=>`<button class="btn option" onclick="answerQuestion(${i})">${o}</button>`).join('');$('answerResult').style.display='none';$('nextQuestionBtn').disabled=true;$('seconds').textContent=30;$('timer').className='timer';startTimer()}
function startTimer(){clearInterval(timerId);if(stopped||answered)return;timerId=setInterval(()=>{timeLeft--;$('seconds').textContent=timeLeft;if(timeLeft<=0){clearInterval(timerId);timeUp()}},1000)}
function stopTimer(){if(answered)return;stopped=true;clearInterval(timerId);$('timer').className='timer stop'}
function resetTimer(){if(answered)return;stopped=false;timeLeft=30;$('seconds').textContent=30;$('timer').className='timer';startTimer()}
function answerQuestion(selected){if(answered)return;answered=true;clearInterval(timerId);const q=data[currentRound].qs[currentQuestion];document.querySelectorAll('.option').forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('correct');if(i===selected&&i!==q.a)b.classList.add('wrong')});const r=$('answerResult');r.style.display='block';r.style.background=selected===q.a?'#d8f7e4':'#ffe0e0';r.textContent=selected===q.a?'✓ Correct answer!':'✗ Wrong answer. Correct: '+q.o[q.a];$('nextQuestionBtn').disabled=false}
function timeUp(){if(answered)return;answered=true;const q=data[currentRound].qs[currentQuestion];document.querySelectorAll('.option').forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('correct')});const r=$('answerResult');r.style.display='block';r.style.background='#fff0cc';r.textContent='⏰ Time up! Correct: '+q.o[q.a];$('nextQuestionBtn').disabled=false}
function nextQuestion(){if(currentQuestion<9)showQuestion(currentQuestion+1);else showNumbers()}
function resetUsedQuestions(){if(confirm('Clear all red selected-question marks?')){usedQuestions={};localStorage.removeItem('quizUsedQuestions6');showNumbers(currentRound)}}
function toggleEditor(){$('editor').classList.toggle('open')}
function save(){localStorage.setItem('quizTeams6',JSON.stringify(teams))}
function renderEditor(){$('editorRows').innerHTML=teams.map((t,i)=>`<div class="editRow"><input value="${t.name}" onchange="renameTeam(${i},this.value)"><input type="number" value="${t.score}" onchange="setScore(${i},this.value)"><button class="btn dark" onclick="changeScore(${i},1)">+</button><button class="btn dark" onclick="changeScore(${i},-1)">−</button></div>`).join('')}
function renameTeam(i,v){teams[i].name=v.trim()||teams[i].name;save();renderHome()}
function setScore(i,v){teams[i].score=Math.max(0,Number(v)||0);save();renderHome()}
function changeScore(i,d){teams[i].score=Math.max(0,teams[i].score+d);save();renderHome()}
function resetScores(){if(confirm('Reset all scores?')){teams.forEach(t=>t.score=0);save();renderHome()}}
renderHome();
</script></body></html>
